name: WordPress CI/CD

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:

  phpunit-tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: imagick, mysqli

      - name: Install Composer dependencies
        run: composer install --no-interaction
      
      - name: Create wp-tests-config.php
        run: |
         cp wp-tests-config-sample.php wp-tests-config.php
         sed -i "s/youremptytestdbnamehere/wordpress_test/" wp-tests-config.php
         sed -i "s/yourusernamehere/root/" wp-tests-config.php
         sed -i "s/yourpasswordhere/password/" wp-tests-config.php
         sed -i "s|localhost|127.0.0.1|" wp-tests-config.php

      - name: Run PHPUnit
        run:  vendor/bin/phpunit --configuration=phpunit.xml.dist

  cypress-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: phpunit-tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_cypress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      wordpress:
        image: wordpress:php8.2-apache
        env:
          WORDPRESS_DB_HOST: mysql
          WORDPRESS_DB_USER: root
          WORDPRESS_DB_PASSWORD: password
          WORDPRESS_DB_NAME: wordpress_cypress
          WORDPRESS_DEBUG: "true"
        ports:
          - 8889:80
        options: >-
          --health-cmd "curl -f http://localhost:80 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.10.0 
          cache: npm

      - name: Install Cypress
        run: |
          if [ -f "tests/cypress/package.json" ]; then
            cd tests/cypress
            npm ci
          else
            npm init -y
            npm install --save-dev cypress
          fi

      - name: Create Cypress config if missing
        run: |
          mkdir -p tests/cypress/support tests/cypress/e2e

          if [ ! -f "tests/cypress/cypress.config.js" ]; then
            cat > tests/cypress/cypress.config.js << 'EOF'
            const { defineConfig } = require('cypress')

            module.exports = defineConfig({
              e2e: {
                baseUrl: 'http://localhost:8889',
                supportFile: 'tests/cypress/support/e2e.js',
                specPattern: 'tests/cypress/e2e/**/*.cy.js',
              },
              video: true,
              screenshotOnRunFailure: true
            })
            EOF
          fi

          if [ ! -f "tests/cypress/support/e2e.js" ]; then
            echo "import './commands'" > tests/cypress/support/e2e.js
          fi

          if [ ! -f "tests/cypress/support/commands.js" ]; then
            cat > tests/cypress/support/commands.js << 'EOF'
            Cypress.Commands.add('wpLogin', (username = 'admin', password = 'password') => {
              cy.visit('/wp-login.php')
              cy.get('#user_login').type(username)
              cy.get('#user_pass').type(password)
              cy.get('#wp-submit').click()
              cy.url().should('include', '/wp-admin/')
            })
            EOF
          fi

      - name: Wait for WordPress to start
        run: |
          for i in {1..30}; do
            if curl -s -f http://localhost:8889 > /dev/null; then
              break
            fi
            sleep 5
          done

      - name: Install and setup WordPress
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar

          ./wp-cli.phar core install \
            --url=http://localhost:8889 \
            --title="WordPress Cypress Tests" \
            --admin_user=admin \
            --admin_password=password \
            --admin_email=admin@example.com \
            --skip-email

          ./wp-cli.phar rewrite structure '/%postname%/'
          ./wp-cli.phar rewrite flush

          ./wp-cli.phar post create \
            --post_title='Test Post' \
            --post_content='Test content' \
            --post_status=publish

      - name: Run Cypress tests
        run: npx cypress run --config-file tests/cypress/cypress.config.js

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            tests/cypress/videos/
            tests/cypress/screenshots/
