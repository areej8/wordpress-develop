# .github/workflows/ci-cd.yml
name: WordPress Core CI/CD

on:
  push:
    branches: [trunk, main, develop]
  pull_request:
    branches: [trunk, main]
  workflow_dispatch:

env:
  LOCAL_PHP: '8.2'

jobs:
  # STAGE 1: Build & Setup
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.LOCAL_PHP }}
        extensions: mysqli, pdo_mysql, mbstring, xml, curl, gd
        tools: composer
        
    - name: Install dependencies
      run: |
        composer install --no-progress --no-suggest
        echo "✅ Dependencies installed"
        
    - name: Verify setup
      run: |
        echo "📋 Environment check:"
        php --version
        composer --version
        ls -la tests/phpunit/tests/ | head -5
        
  # STAGE 2: Unit Tests (like your local command)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_unit_test
        ports:
          - 3306:3306
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.LOCAL_PHP }}
        extensions: mysqli, pdo_mysql
        tools: composer
        
    - name: Install dependencies
      run: composer install --no-progress

    - name: Setup database
      run: |
        mysql -h127.0.0.1 -P3306 -uroot -ppassword -e "CREATE DATABASE IF NOT EXISTS wordpress_unit_test;"

    - name: Create wp-tests-config.php
      run: |
        cp wp-tests-config-sample.php wp-tests-config.php
        sed -i "s/youremptytestdbnamehere/wordpress_unit_test/" wp-tests-config.php
        sed -i "s/yourusernamehere/root/" wp-tests-config.php
        sed -i "s/yourpasswordhere/password/" wp-tests-config.php
        sed -i "s|localhost|127.0.0.1|" wp-tests-config.php

    - name: Run formatting tests
      run: |
        echo "Running formatting tests..."
        vendor/bin/phpunit \
        --configuration=phpunit.xml.dist \
        --group=formatting \
        --coverage-text

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-coverage
        path: |
          coverage/
          coverage.xml

        
  # STAGE 3: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run all tests
      run: |
        echo "Running all tests..."
        vendor/bin/phpunit --configuration=phpunit.xml.dist
        
    - name: Generate test report
      run: |
        echo "Generating test report..."
        vendor/bin/phpunit \
          --configuration=tests/phpunit/phpunit.xml.dist \
          --log-junit=junit.xml \
          --coverage-clover=integration-coverage.xml
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: |
          junit.xml
          integration-coverage.xml
