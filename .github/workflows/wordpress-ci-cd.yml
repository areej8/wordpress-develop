# .github/workflows/tests.yml
name: WordPress Core Tests

on:
  push:
    branches: [trunk, main, develop]
  pull_request:
    branches: [trunk, main]

jobs:
  tests:
    name: Run All WordPress Unit Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP 8.2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo_mysql, mbstring, xml, curl, gd
        tools: composer
        
    - name: Install dependencies
      run: composer install --no-progress

    - name: Wait for MySQL
      run: |
        echo "⏳ Waiting for MySQL..."
        for i in {1..30}; do
          if mysqladmin ping -h127.0.0.1 -uroot -ppassword --silent; then
            echo "✅ MySQL is ready!"
            break
          fi
          echo "Attempt $i/30..."
          sleep 2
        done

    - name: Setup test database
      run: |
        mysql -h127.0.0.1 -P3306 -uroot -ppassword -e "CREATE DATABASE IF NOT EXISTS wordpress_test;"
        mysql -h127.0.0.1 -P3306 -uroot -ppassword -e "CREATE DATABASE IF NOT EXISTS wordpress_test_tmp;"

    - name: Create wp-tests-config.php
      run: |
        cp wp-tests-config-sample.php wp-tests-config.php
        sed -i "s/youremptytestdbnamehere/wordpress_test/" wp-tests-config.php
        sed -i "s/yourusernamehere/root/" wp-tests-config.php
        sed -i "s/yourpasswordhere/password/" wp-tests-config.php
        sed -i "s|localhost|127.0.0.1|" wp-tests-config.php

    - name: Run all unit tests
      run: |
        echo "🧪 Running all WordPress core unit tests..."
        vendor/bin/phpunit --configuration=phpunit.xml.dist
        
    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-failure-logs
        path: |
          phpunit.xml.dist
        retention-days: 7

