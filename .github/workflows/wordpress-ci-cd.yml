name: WordPress CI/CD

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  cypress-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # This allows the job to fail without breaking the pipeline
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_cypress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.10.0
      
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('tests/cypress/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-
      
      - name: Install Cypress dependencies
        run: |
          cd tests/cypress
          npm install
      
      - name: Create WordPress directory structure
        run: |
          mkdir -p wordpress
          cd wordpress
      
      - name: Download and extract WordPress
        run: |
          curl -O https://wordpress.org/latest.tar.gz
          tar -xzf latest.tar.gz
          mv wordpress/* .
          rm -rf wordpress latest.tar.gz
        working-directory: wordpress
      
      - name: Create wp-config.php
        run: |
          cat > wp-config.php << 'EOF'
          <?php
          define('DB_NAME', 'wordpress_cypress');
          define('DB_USER', 'root');
          define('DB_PASSWORD', 'password');
          define('DB_HOST', '127.0.0.1:3306');
          define('DB_CHARSET', 'utf8');
          define('DB_COLLATE', '');
          
          define('AUTH_KEY',         'put your unique phrase here');
          define('SECURE_AUTH_KEY',  'put your unique phrase here');
          define('LOGGED_IN_KEY',    'put your unique phrase here');
          define('NONCE_KEY',        'put your unique phrase here');
          define('AUTH_SALT',        'put your unique phrase here');
          define('SECURE_AUTH_SALT', 'put your unique phrase here');
          define('LOGGED_IN_SALT',   'put your unique phrase here');
          define('NONCE_SALT',       'put your unique phrase here');
          
          $table_prefix = 'wp_';
          
          define('WP_DEBUG', true);
          define('WP_DEBUG_LOG', true);
          define('WP_DEBUG_DISPLAY', false);
          
          if (!defined('ABSPATH')) {
              define('ABSPATH', __DIR__ . '/');
          }
          
          require_once ABSPATH . 'wp-settings.php';
          EOF
        working-directory: wordpress
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, xml, gd
          coverage: none
      
      - name: Start PHP built-in server
        run: |
          php -S localhost:8889 -t . &
          echo $! > /tmp/php-server.pid
          sleep 5
      
      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -s -f http://localhost:8889 > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... attempt $i/30"
            sleep 2
          done
      
      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
      
      - name: Install WordPress
        run: |
          wp core install \
            --url=http://localhost:8889 \
            --title="WordPress Cypress Tests" \
            --admin_user=admin \
            --admin_password=password \
            --admin_email=admin@example.com \
            --skip-email \
            --allow-root
      
      - name: Configure WordPress
        run: |
          wp rewrite structure '/%postname%/' --allow-root
          wp rewrite flush --allow-root
          wp post create \
            --post_title='Test Post' \
            --post_content='Test content for Cypress testing' \
            --post_status=publish \
            --allow-root
      
      - name: Verify WordPress is accessible
        run: |
          curl -I http://localhost:8889
          curl http://localhost:8889 | grep -i wordpress || echo "WordPress might not be fully loaded"
      
      - name: Run Cypress tests
        id: cypress_tests
        continue-on-error: true  # This specific step won't fail the job
        run: |
          npx cypress run --config-file tests/cypress/cypress.config.js || echo "Some Cypress tests failed"
        env:
          CYPRESS_BASE_URL: http://localhost:8889
      
      - name: Check Cypress test results
        if: always()
        run: |
          if [ "${{ steps.cypress_tests.outcome }}" == "failure" ]; then
            echo "⚠️ Warning: Some Cypress tests failed, but the pipeline continues"
            echo "Check the artifacts for details"
          else
            echo "✅ All Cypress tests passed!"
          fi
      
      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            tests/cypress/videos/
            tests/cypress/screenshots/
          if-no-files-found: ignore
      
      - name: Comment test results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.cypress_tests.outcome }}';
            const icon = outcome === 'success' ? '✅' : '⚠️';
            const message = outcome === 'success' 
              ? 'All Cypress E2E tests passed!' 
              : 'Some Cypress E2E tests failed. Check artifacts for details.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${icon} **Cypress Test Results**\n\n${message}`
            });
      
      - name: Stop PHP server
        if: always()
        run: |
          if [ -f /tmp/php-server.pid ]; then
            kill $(cat /tmp/php-server.pid) || true
          fi
