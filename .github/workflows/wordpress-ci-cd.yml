# .github/workflows/wordpress-ci-cd.yml
name: WordPress Core CI/CD

on:
  push:
    branches: [trunk, main, develop]
  pull_request:
    branches: [trunk, main]
  workflow_dispatch:

env:
  # Port 8889 matches your docker-compose.yml
  CYPRESS_BASE_URL: http://localhost:8889
  WP_ADMIN_USER: admin
  WP_ADMIN_PASS: password
  WP_ADMIN_EMAIL: admin@example.com
  LOCAL_PORT: 8889

jobs:
  # PHPUnit Tests
  phpunit-tests:
    name: PHPUnit Unit Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP 8.2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo_mysql, mbstring, xml, curl, gd
        tools: composer
        
    - name: Install dependencies
      run: composer install --no-progress

    - name: Wait for MySQL
      run: |
        echo "⏳ Waiting for MySQL..."
        for i in {1..30}; do
          if mysqladmin ping -h127.0.0.1 -uroot -ppassword --silent; then
            echo "✅ MySQL is ready!"
            break
          fi
          echo "Attempt $i/30..."
          sleep 2
        done

    - name: Setup test database
      run: |
        mysql -h127.0.0.1 -P3306 -uroot -ppassword -e "CREATE DATABASE IF NOT EXISTS wordpress_test;"
        mysql -h127.0.0.1 -P3306 -uroot -ppassword -e "CREATE DATABASE IF NOT EXISTS wordpress_test_tmp;"

    - name: Create wp-tests-config.php
      run: |
        cp wp-tests-config-sample.php wp-tests-config.php
        sed -i "s/youremptytestdbnamehere/wordpress_test/" wp-tests-config.php
        sed -i "s/yourusernamehere/root/" wp-tests-config.php
        sed -i "s/yourpasswordhere/password/" wp-tests-config.php
        sed -i "s|localhost|127.0.0.1|" wp-tests-config.php
        
    - name: Run all unit tests
      run: |
        echo "🧪 Running all WordPress core unit tests..."
        vendor/bin/phpunit --configuration=phpunit.xml.dist
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phpunit-results
        path: |
          tests/phpunit/build/
        retention-days: 7

  # Cypress E2E Tests
  cypress-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: phpunit-tests
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_cypress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          
      wordpress:
        # Use the same PHP version as your development
        image: wordpress:php8.2-apache
        env:
          WORDPRESS_DB_HOST: mysql
          WORDPRESS_DB_USER: root
          WORDPRESS_DB_PASSWORD: password
          WORDPRESS_DB_NAME: wordpress_cypress
          WORDPRESS_DEBUG: "true"
          WORDPRESS_CONFIG_EXTRA: |
            define('WP_DEBUG_LOG', true);
            define('SCRIPT_DEBUG', true);
        ports:
          # PORT 8889 matches your local development
          - 8889:80
        depends_on:
          - mysql
        options: >-
          --health-cmd "curl -f http://localhost:80 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install Cypress
      run: |
        echo "📦 Installing Cypress..."
        
        # Check if package.json exists in tests/cypress
        if [ -f "tests/cypress/package.json" ]; then
          cd tests/cypress
          npm ci
          cd ../..
        else
          # Install Cypress globally for the project
          npm init -y
          npm install --save-dev cypress
        fi
        
        echo "✅ Cypress installed"
        
    - name: Create Cypress config if missing
      run: |
        echo "🔧 Setting up Cypress configuration..."
        
        if [ ! -f "tests/cypress/cypress.config.js" ]; then
          echo "Creating cypress.config.js..."
          cat > tests/cypress/cypress.config.js << 'EOF'
          const { defineConfig } = require('cypress')
          
          module.exports = defineConfig({
            e2e: {
              baseUrl: 'http://localhost:8889',
              supportFile: 'tests/cypress/support/e2e.js',
              specPattern: 'tests/cypress/e2e/**/*.cy.js',
              videosFolder: 'tests/cypress/videos',
              screenshotsFolder: 'tests/cypress/screenshots',
              downloadsFolder: 'tests/cypress/downloads',
              fixturesFolder: 'tests/cypress/fixtures',
            },
            video: true,
            screenshotOnRunFailure: true,
            viewportWidth: 1280,
            viewportHeight: 720,
          })
          EOF
        fi
        
        # Create support files if missing
        if [ ! -f "tests/cypress/support/e2e.js" ]; then
          mkdir -p tests/cypress/support
          cat > tests/cypress/support/e2e.js << 'EOF'
          import './commands'
          EOF
        fi
        
        if [ ! -f "tests/cypress/support/commands.js" ]; then
          cat > tests/cypress/support/commands.js << 'EOF'
          Cypress.Commands.add('wpLogin', (username = 'admin', password = 'password') => {
            cy.visit('/wp-login.php')
            cy.get('#user_login').type(username)
            cy.get('#user_pass').type(password)
            cy.get('#wp-submit').click()
            cy.url().should('include', '/wp-admin/')
          })
          EOF
        fi
        
    - name: Wait for WordPress
      run: |
        echo "⏳ Waiting for WordPress on port 8889..."
        
        # Wait for WordPress to be accessible
        for i in {1..30}; do
          if curl -s -f http://localhost:8889 > /dev/null; then
            echo "✅ WordPress is ready!"
            break
          fi
          echo "Attempt $i/30 - Waiting for WordPress..."
          sleep 5
        done
        
        # Extra wait to ensure WordPress is fully loaded
        sleep 10
        
    - name: Install and setup WordPress
      run: |
        echo "🔧 Setting up WordPress for tests..."
        
        # Install WP-CLI
        curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        chmod +x wp-cli.phar
        
        # Install WordPress
        ./wp-cli.phar core install \
          --url=http://localhost:8889 \
          --title="WordPress Cypress Tests" \
          --admin_user=admin \
          --admin_password=password \
          --admin_email=admin@example.com \
          --skip-email
        
        # Setup permalinks
        ./wp-cli.phar rewrite structure '/%postname%/'
        ./wp-cli.phar rewrite flush
        
        # Create test content
        ./wp-cli.phar post create --post_title='Test Post' --post_content='Test content' --post_status=publish
        
        echo "✅ WordPress setup complete!"
        
    - name: Run Cypress tests
      run: |
        echo "🧪 Running Cypress E2E tests..."
        
        # Check if we have Cypress config
        if [ -f "tests/cypress/cypress.config.js" ]; then
          CONFIG_FILE="tests/cypress/cypress.config.js"
        else
          CONFIG_FILE="cypress.config.js"
        fi
        
        echo "Using config: $CONFIG_FILE"
        
        # Run Cypress tests
        npx cypress run --config-file="$CONFIG_FILE" --browser=chrome
        
    - name: Upload Cypress artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-artifacts
        path: |
          tests/cypress/videos/
          tests/cypress/screenshots/
        retention-days: 7

  # Summary
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [phpunit-tests, cypress-tests]
    if: always()
    
    steps:
    - name: Generate summary
      run: |
        echo "## 📊 WordPress Core Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Test Suite | Status | Details |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|--------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| PHPUnit Tests | ${{ needs.phpunit-tests.result }} | Core unit tests |" >> $GITHUB_STEP_SUMMARY
        echo "| Cypress E2E Tests | ${{ needs.cypress-tests.result }} | UI tests on port 8889 |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.phpunit-tests.result }}" = "success" ] && [ "${{ needs.cypress-tests.result }}" = "success" ]; then
          echo "🎉 **All tests passed!**" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Some tests failed. Check artifacts for details.**" >> $GITHUB_STEP_SUMMARY
        fi
