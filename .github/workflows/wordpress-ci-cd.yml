# .github/workflows/wordpress-ci-cd.yml
name: WordPress Core CI/CD

on:
  push:
    branches: [trunk, main, develop]
  pull_request:
    branches: [trunk, main]
  workflow_dispatch:

env:
  CYPRESS_BASE_URL: http://localhost:8889
  WP_ADMIN_USER: admin
  WP_ADMIN_PASS: password
  WP_ADMIN_EMAIL: admin@example.com
  LOCAL_PORT: 8889

jobs:
  # ============================================
  # PHPUnit Tests - Robust Configuration
  # ============================================
  phpunit-tests:
    name: PHPUnit Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mysqli, pdo_mysql, mbstring, xml, curl, gd, zip
        tools: composer
        
    - name: Install Composer dependencies
      run: |
        composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Wait for MySQL to be ready
      run: |
        echo "⏳ Waiting for MySQL..."
        for i in {1..30}; do
          if mysqladmin ping -h127.0.0.1 -uroot -ppassword --silent; then
            echo "✅ MySQL is ready!"
            break
          fi
          echo "Attempt $i/30..."
          sleep 2
        done

    - name: Setup WordPress test databases
      run: |
        mysql -h127.0.0.1 -P3306 -uroot -ppassword -e "CREATE DATABASE IF NOT EXISTS wordpress_test;"
        mysql -h127.0.0.1 -P3306 -uroot -ppassword -e "CREATE DATABASE IF NOT EXISTS wordpress_test_tmp;"

    - name: Create wp-tests-config.php
      run: |
        if [ -f wp-tests-config-sample.php ]; then
          cp wp-tests-config-sample.php wp-tests-config.php
          sed -i "s/youremptytestdbnamehere/wordpress_test/" wp-tests-config.php
          sed -i "s/yourusernamehere/root/" wp-tests-config.php
          sed -i "s/yourpasswordhere/password/" wp-tests-config.php
          sed -i "s|localhost|127.0.0.1|" wp-tests-config.php
          echo "✅ Test configuration created from sample"
        else
          echo "⚠️ wp-tests-config-sample.php not found"
          echo "Checking for existing tests..."
          ls -la tests/
        fi

    - name: Check environment
      run: |
        echo "🔍 Environment Check"
        echo "===================="
        echo "PHP Version: $(php -v | head -n 1)"
        echo "MySQL Version: $(mysql --version)"
        echo "Composer Version: $(composer --version)"
        echo ""
        echo "WordPress test directory:"
        ls -la tests/phpunit/tests/ | head -10

    - name: Run PHPUnit tests
      run: |
        echo "🧪 Running WordPress core unit tests..."
        
        # Check if phpunit.xml.dist exists
        if [ -f "phpunit.xml.dist" ]; then
          echo "Using phpunit.xml.dist"
          vendor/bin/phpunit --configuration=phpunit.xml.dist
        elif [ -f "tests/phpunit/phpunit.xml.dist" ]; then
          echo "Using tests/phpunit/phpunit.xml.dist"
          vendor/bin/phpunit --configuration=tests/phpunit/phpunit.xml.dist
        else
          echo "⚠️ No phpunit.xml.dist found, running tests directly"
          vendor/bin/phpunit tests/phpunit/tests/
        fi
        
    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: phpunit-failure-${{ matrix.php }}
        path: |
          wp-tests-config.php
          tests/phpunit/build/
        retention-days: 7

  # ============================================
  # Cypress E2E Tests (USING YOUR EXISTING TESTS)
  # ============================================
  cypress-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: phpunit-tests
    if: always()
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_cypress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          
      wordpress:
        image: wordpress:php8.2-apache
        env:
          WORDPRESS_DB_HOST: mysql
          WORDPRESS_DB_USER: root
          WORDPRESS_DB_PASSWORD: password
          WORDPRESS_DB_NAME: wordpress_cypress
          WORDPRESS_DEBUG: "true"
        ports:
          - 8889:80
        options: >-
          --health-cmd "curl -f http://localhost:80 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Check existing Cypress setup
      run: |
        echo "🔍 Checking existing Cypress setup..."
        echo ""
        echo "Cypress directory:"
        ls -la tests/cypress/
        echo ""
        echo "Test files:"
        ls -la tests/cypress/e2e/
        echo ""
        echo "Support files:"
        ls -la tests/cypress/support/ 2>/dev/null || echo "No support directory"
        
    - name: Install Cypress dependencies
      run: |
        echo "📦 Installing Cypress..."
        
        # Check if tests/cypress has its own package.json
        if [ -f "tests/cypress/package.json" ]; then
          echo "Installing from tests/cypress/package.json"
          cd tests/cypress
          npm ci
          cd ../..
        elif [ -f "package.json" ]; then
          echo "Installing from root package.json"
          npm ci
        else
          # Create minimal setup
          echo "Creating minimal Cypress setup..."
          npm init -y
          npm install --save-dev cypress
        fi
        
    - name: Create Cypress config if missing
      run: |
        echo "🔧 Setting up Cypress configuration..."
        
        # Check if config exists
        if [ ! -f "cypress.config.js" ] && [ ! -f "tests/cypress/cypress.config.js" ]; then
          echo "Creating cypress.config.js..."
          cat > cypress.config.js << 'EOF'
          const { defineConfig } = require('cypress')
          
          module.exports = defineConfig({
            e2e: {
              baseUrl: 'http://localhost:8889',
              supportFile: 'tests/cypress/support/e2e.js',
              specPattern: 'tests/cypress/e2e/**/*.cy.js',
              videosFolder: 'tests/cypress/videos',
              screenshotsFolder: 'tests/cypress/screenshots',
              downloadsFolder: 'tests/cypress/downloads',
              fixturesFolder: 'tests/cypress/fixtures',
            },
            video: true,
            screenshotOnRunFailure: true,
          })
          EOF
          echo "✅ Created cypress.config.js"
        else
          echo "✅ Cypress config already exists"
        fi
        
        # Create minimal support files if missing
        if [ ! -f "tests/cypress/support/e2e.js" ]; then
          mkdir -p tests/cypress/support
          echo "import './commands'" > tests/cypress/support/e2e.js
          echo "Created e2e.js"
        fi
        
        if [ ! -f "tests/cypress/support/commands.js" ]; then
          cat > tests/cypress/support/commands.js << 'EOF'
          Cypress.Commands.add('wpLogin', (username = 'admin', password = 'password') => {
            cy.visit('/wp-login.php')
            cy.get('#user_login').type(username)
            cy.get('#user_pass').type(password)
            cy.get('#wp-submit').click()
            cy.url().should('include', '/wp-admin/')
          })
          EOF
          echo "Created commands.js"
        fi
        
    - name: Wait for WordPress to be ready
      run: |
        echo "⏳ Waiting for WordPress on port 8889..."
        
        # Wait for WordPress to start
        for i in {1..30}; do
          if curl -s -f http://localhost:8889 > /dev/null; then
            echo "✅ WordPress is accessible"
            break
          fi
          echo "Attempt $i/30..."
          sleep 5
        done
        
        # Extra wait for full initialization
        sleep 10
        
    - name: Setup WordPress for testing
      run: |
        echo "🔧 Setting up WordPress for Cypress tests..."
        
        # Install WP-CLI
        curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        chmod +x wp-cli.phar
        
        # Install WordPress
        ./wp-cli.phar core install \
          --url=http://localhost:8889 \
          --title="WordPress Cypress Tests" \
          --admin_user=admin \
          --admin_password=password \
          --admin_email=admin@example.com \
          --skip-email
        
        # Enable pretty permalinks
        ./wp-cli.phar rewrite structure '/%postname%/'
        ./wp-cli.phar rewrite flush
        
        echo "✅ WordPress setup complete"
        
    - name: Run existing Cypress tests
      run: |
        echo "🧪 Running existing Cypress tests..."
        
        # Check which config file to use
        if [ -f "tests/cypress/cypress.config.js" ]; then
          CONFIG_FILE="tests/cypress/cypress.config.js"
        elif [ -f "cypress.config.js" ]; then
          CONFIG_FILE="cypress.config.js"
        else
          echo "⚠️ No Cypress config found, using default"
          CONFIG_FILE="cypress.config.js"
        fi
        
        echo "Using config: $CONFIG_FILE"
        
        # Run Cypress tests
        npx cypress run --config-file="$CONFIG_FILE" --browser=chrome
        
    - name: Upload Cypress artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-artifacts
        path: |
          tests/cypress/videos/
          tests/cypress/screenshots/
        retention-days: 7

  # ============================================
  # Render Deployment (FREE TIER)
  # ============================================
  deploy-render:
    name: Deploy to Render (Free)
    runs-on: ubuntu-latest
    needs: [phpunit-tests, cypress-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/trunk'
    
    steps:
    - name: Trigger Render Deployment
      run: |
        echo "🚀 Deploying WordPress Core to Render.com (Free Tier)..."
        
        if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
          echo "📞 Calling Render deploy hook..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "201" ]; then
            echo "✅ Deployment triggered successfully!"
            echo "⏳ Build will start on Render.com..."
            echo "🌐 Your site will be live in 2-3 minutes"
          else
            echo "⚠️  Deploy hook returned HTTP $RESPONSE"
            echo "Check your Render service status"
          fi
        else
          echo "❌ No RENDER_DEPLOY_HOOK secret found"
          echo ""
          echo "📋 To set up FREE Render deployment:"
          echo ""
          echo "1. Go to https://render.com"
          echo "2. Sign up (FREE with GitHub)"
          echo "3. Create New Web Service"
          echo "4. Connect this repository"
          echo "5. Configure:"
          echo "   - Name: wordpress-core-free"
          echo "   - Environment: Docker"
          echo "   - Dockerfile Path: ./Dockerfile"
          echo "   - Plan: Free"
          echo "   - Instance Type: Free"
          echo "6. Get deploy hook from Settings"
          echo "7. Add to GitHub Secrets as RENDER_DEPLOY_HOOK"
        fi
        
    - name: Deployment Summary
      run: |
        echo "📋 Deployment Summary"
        echo "====================="
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Time: $(date)"
        echo ""
        if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
          echo "✅ Render deployment initiated"
        else
          echo "⚠️  Render deployment not configured"
          echo "    Set up Render.com and add deploy hook secret"
        fi

  # ============================================
  # Summary
  # ============================================
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [phpunit-tests, cypress-tests, deploy-render]
    if: always()
    
    steps:
    - name: Generate summary
      run: |
        echo "# 📊 WordPress Core CI/CD Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Test Suite | Status | Description |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
        echo "| PHPUnit Tests | ${{ needs.phpunit-tests.result }} | Core unit tests |" >> $GITHUB_STEP_SUMMARY
        echo "| Cypress E2E Tests | ${{ needs.cypress-tests.result }} | UI tests (port 8889) |" >> $GITHUB_STEP_SUMMARY
        echo "| Render Deployment | ${{ needs.deploy-render.result }} | Free tier deployment |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.phpunit-tests.result }}" = "success" ] && [ "${{ needs.cypress-tests.result }}" = "success" ]; then
          echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Some tests failed. Check artifacts for details.**" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📁 Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- PHPUnit Results: Available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Cypress Videos/Screenshots: Available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
          echo "### 🚀 Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Deployment to Render.com triggered." >> $GITHUB_STEP_SUMMARY
        else
          echo "### ⚠️ Deployment Not Configured" >> $GITHUB_STEP_SUMMARY
          echo "To deploy to Render.com:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to https://render.com" >> $GITHUB_STEP_SUMMARY
          echo "2. Create Web Service with Docker" >> $GITHUB_STEP_SUMMARY
          echo "3. Get deploy hook and add to GitHub Secrets" >> $GITHUB_STEP_SUMMARY
        fi
