name: WordPress CI/CD

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  cypress-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_cypress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, xml, gd, imagick
          coverage: none
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.10.0
      
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('tests/cypress/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-
      
      - name: Install Composer dependencies
        run: composer install --no-interaction
      
      - name: Install Cypress dependencies
        run: |
          cd tests/cypress
          npm install
      
      - name: Setup WordPress environment
        run: |
          if [ -d "src" ]; then
            echo "📁 WordPress core found in src directory"
            echo "WORDPRESS_DIR=src" >> $GITHUB_ENV
          else
            echo "📁 WordPress core in root directory"
            echo "WORDPRESS_DIR=." >> $GITHUB_ENV
          fi
      
      - name: Create wp-config.php for CI
        run: |
          # Check if wp-config.php already exists in root
          if [ -f wp-config.php ]; then
            echo "📝 Updating existing wp-config.php for CI environment"
            cp wp-config.php wp-config.php.backup
            # Replace mysql with 127.0.0.1:3306 for GitHub Actions
            sed -i "s/define( 'DB_HOST', 'mysql' );/define( 'DB_HOST', '127.0.0.1:3306' );/" wp-config.php
            # Update database name if needed
            sed -i "s/define( 'DB_NAME', 'wordpress_develop' );/define( 'DB_NAME', 'wordpress_cypress' );/" wp-config.php
            echo "✅ wp-config.php updated for CI"
          else
            echo "❌ wp-config.php not found in root"
            exit 1
          fi
          
          # Display the database configuration for verification
          echo "🔍 Database configuration:"
          grep "define( 'DB_" wp-config.php
      
      - name: Verify database connection
        run: |
          echo "🔍 Testing database connection..."
          mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e "SHOW DATABASES;" || echo "⚠️ Direct MySQL connection failed"
          mysql -h 127.0.0.1 -P 3306 -u root -ppassword wordpress_cypress -e "SELECT 1;" || echo "⚠️ Database wordpress_cypress not accessible yet"
      
      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
      
      - name: Start PHP built-in server
        run: |
          echo "🚀 Starting PHP server from root directory"
          php -S localhost:8889 -t . > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid
          sleep 5
      
      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -s -f http://localhost:8889 > /dev/null 2>&1; then
              echo "✅ Server is ready"
              break
            fi
            echo "⏳ Waiting for server... attempt $i/30"
            sleep 2
          done
      
      - name: Install WordPress
        run: |
          wp core install \
            --url=http://localhost:8889 \
            --title="WordPress Cypress Tests" \
            --admin_user=admin \
            --admin_password=password \
            --admin_email=admin@example.com \
            --skip-email \
            --allow-root
      
      - name: Configure WordPress
        run: |
          wp rewrite structure '/%postname%/' --allow-root
          wp rewrite flush --allow-root
          wp option update blogdescription "Automated Testing Environment" --allow-root
      
      - name: Verify WordPress installation
        run: |
          echo "🔍 Checking WordPress installation..."
          curl -I http://localhost:8889
          wp core version --allow-root
          wp db check --allow-root
      
      - name: Run Cypress tests
        id: cypress_tests
        continue-on-error: true
        run: npx cypress run --config-file tests/cypress/cypress.config.js
        env:
          CYPRESS_BASE_URL: http://localhost:8889
      
      - name: Generate test report
        if: always()
        run: |
          echo "## 🧪 Cypress E2E Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.cypress_tests.outcome }}" == "success" ]; then
            echo "✅ **Status**: All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Status**: Some tests failed (non-blocking)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Check artifacts for detailed results" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: tests/cypress/screenshots/
          if-no-files-found: ignore
      
      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: tests/cypress/videos/
          if-no-files-found: ignore
      
      - name: Upload PHP server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-server-logs
          path: /tmp/php-server.log
          if-no-files-found: ignore
      
      - name: Stop PHP server
        if: always()
        run: |
          if [ -f /tmp/php-server.pid ]; then
            kill $(cat /tmp/php-server.pid) || true
          fi
