name: CI/CD with Docker Compose

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  cypress-docker:
    name: Cypress with Docker Compose
    runs-on: ubuntu-latest
    needs: phpunit-tests
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Docker Compose
        run: |
          docker compose version
      
      - name: Create docker-compose.yml
        run: |
          cat > docker-compose.yml << 'EOF'
          version: '3.8'
          
          services:
            mysql:
              image: mysql:8.0
              environment:
                MYSQL_ROOT_PASSWORD: password
                MYSQL_DATABASE: wordpress_cypress
              ports:
                - "3306:3306"
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                timeout: 20s
                retries: 10
              
            wordpress:
              build: .
              depends_on:
                mysql:
                  condition: service_healthy
              ports:
                - "8889:80"
              environment:
                WORDPRESS_DB_HOST: mysql
                WORDPRESS_DB_USER: root
                WORDPRESS_DB_PASSWORD: password
                WORDPRESS_DB_NAME: wordpress_cypress
                WORDPRESS_DEBUG: 1
              volumes:
                - ./:/var/www/html
                - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
          
            cypress:
              image: cypress/included:12.0.0
              depends_on:
                - wordpress
              working_dir: /e2e
              volumes:
                - ./tests/cypress:/e2e
                - ./tests/cypress/screenshots:/e2e/screenshots
                - ./tests/cypress/videos:/e2e/videos
              environment:
                CYPRESS_BASE_URL: http://wordpress:80
                CYPRESS_WP_USERNAME: admin
                CYPRESS_WP_PASSWORD: password
              command: |
                bash -c "
                echo 'Waiting for WordPress to be ready...'
                while ! curl -s http://wordpress:80 > /dev/null; do sleep 2; done
                echo 'Running Cypress tests...'
                npx cypress run
                "
          EOF
          
          cat > Dockerfile << 'EOF'
          FROM wordpress:php8.2-apache
          
          # Install dependencies and build WordPress
          RUN apt-get update && apt-get install -y \
              nodejs npm git curl \
              && rm -rf /var/lib/apt/lists/*
          
          WORKDIR /var/www/html
          
          # Copy WordPress files
          COPY . .
          
          # Install and build WordPress
          RUN npm install && npm run build:dev
          
          # Set permissions
          RUN chown -R www-data:www-data /var/www/html
          EOF
      
      - name: Build and start Docker environment
        run: |
          docker compose up -d
          docker compose ps
          sleep 30  # Wait for services to start
      
      - name: Install WordPress via WP-CLI
        run: |
          docker compose exec -T wordpress wp core install \
            --url=http://localhost:8889 \
            --title="Test Site" \
            --admin_user=admin \
            --admin_password=password \
            --admin_email=admin@example.com \
            --skip-email
      
      - name: Run Cypress tests
        run: |
          docker compose logs cypress
      
      - name: Get test results
        if: always()
        run: |
          docker compose logs cypress > cypress.log
          cat cypress.log
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: |
            tests/cypress/screenshots
            tests/cypress/videos
            cypress.log
      
      - name: Stop Docker environment
        if: always()
        run: |
          docker compose down -v
