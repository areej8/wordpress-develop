name: Cypress-test

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  cypress-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install npm dependencies
        run: |
          echo "==== Installing npm dependencies ===="
          npm ci
      
      - name: Build WordPress
        run: |
          echo "==== Building WordPress ===="
          npm run build:dev
      
      - name: Set up environment variables
        run: |
          cat > .env << 'EOF'
          LOCAL_PHP=8.2-fpm
          LOCAL_PORT=8889
          LOCAL_DIR=src
          LOCAL_DB_TYPE=mysql
          LOCAL_DB_VERSION=8.0
          LOCAL_PHP_XDEBUG=false
          LOCAL_PHP_MEMCACHED=false
          PHP_FPM_UID=1000
          PHP_FPM_GID=1000
          CYPRESS_VIDEO=true
          CYPRESS_SCREENSHOT_ON_RUN_FAILURE=true
          EOF
          
          cat .env
      
      - name: Create Cypress directories
        run: |
          mkdir -p tests/cypress/screenshots
          mkdir -p tests/cypress/videos
          chmod -R 777 tests/cypress
      
      - name: Validate existing docker-compose.yml
        run: |
          echo "==== Checking existing docker-compose.yml ===="
          if [ ! -f docker-compose.yml ]; then
            echo "ERROR: docker-compose.yml not found"
            exit 1
          fi
          
          echo "Original docker-compose.yml structure:"
          head -50 docker-compose.yml
      
      - name: Add Cypress service to docker-compose
        run: |
          # Create a backup first
          cp docker-compose.yml docker-compose.yml.backup
          
          # Check if docker-compose.yml already has cypress service
          if grep -q "^  cypress:" docker-compose.yml; then
            echo "Cypress service already exists in docker-compose.yml"
            exit 0
          fi
          
          # Create modified docker-compose.yml with Cypress service
          cat > docker-compose.cypress.yml << 'EOF'
          version: '3.8'
          
          services:
            # ... existing services will be inserted here
          
            ##
            # The Cypress container for E2E testing.
            ##
            cypress:
              image: cypress/included:13.6.0
              networks:
                - wpdevnet
              working_dir: /e2e
              volumes:
                - ./tests/cypress:/e2e
              environment:
                CYPRESS_baseUrl: http://wordpress-develop
                CYPRESS_WP_USERNAME: admin
                CYPRESS_WP_PASSWORD: password
                CYPRESS_VIDEO: ${CYPRESS_VIDEO-true}
                CYPRESS_SCREENSHOT_ON_RUN_FAILURE: ${CYPRESS_SCREENSHOT_ON_RUN_FAILURE-true}
              entrypoint: ""
              command:
                - sh
                - -c
                - |
                  echo '==== Waiting for WordPress to be ready ===='
                  max_attempts=60
                  attempt=0
                  until wget --spider -q http://wordpress-develop 2>/dev/null || [ $attempt -eq $max_attempts ]; do
                    echo "Attempt $((attempt+1))/$max_attempts: WordPress not ready yet..."
                    sleep 3
                    attempt=$((attempt+1))
                  done
                  
                  if [ $attempt -eq $max_attempts ]; then
                    echo 'ERROR: WordPress did not become ready in time'
                    exit 1
                  fi
                  
                  echo '==== WordPress is ready! Running Cypress tests ===='
                  npx cypress run --browser electron --headless
              depends_on:
                wordpress-develop:
                  condition: service_started
                mysql:
                  condition: service_healthy
          
          networks:
            wpdevnet:
              external: true
          
          volumes:
            mysql_data: {}
          EOF
          
          # Extract existing services (everything between 'services:' and 'networks:' or 'volumes:')
          awk '
            /^services:/ {in_services=1}
            /^networks:/ {if(in_services) in_services=0}
            /^volumes:/ {if(in_services) in_services=0}
            in_services && !/^services:/ {print}
          ' docker-compose.yml > existing-services.yml
          
          # Combine: start + existing services + cypress service + end
          echo "version: '3.8'" > docker-compose.yml.new
          echo "" >> docker-compose.yml.new
          echo "services:" >> docker-compose.yml.new
          cat existing-services.yml >> docker-compose.yml.new
          
          # Add cypress service from the template
          awk '
            /^  cypress:/ {in_cypress=1}
            in_cypress {print}
            /^networks:/ {if(in_cypress) in_cypress=0}
          ' docker-compose.cypress.yml >> docker-compose.yml.new
          
          # Add networks and volumes sections
          awk '
            /^networks:/ {in_networks=1}
            /^volumes:/ {in_volumes=1; in_networks=0}
            in_networks || in_volumes {print}
          ' docker-compose.cypress.yml >> docker-compose.yml.new
          
          mv docker-compose.yml.new docker-compose.yml
          
          echo "==== Modified docker-compose.yml ===="
          tail -40 docker-compose.yml
          
          echo "==== Validating docker-compose.yml ===="
          docker compose config --quiet && echo "✓ docker-compose.yml is valid" || { echo "✗ docker-compose.yml is invalid"; exit 1; }
      
      - name: Start Docker Compose services
        run: |
          echo "==== Starting Docker Compose services ===="
          docker compose up -d wordpress-develop php mysql cli
          
          echo "==== Waiting for services to initialize ===="
          sleep 15
          
          echo "==== Service status ===="
          docker compose ps
      
      - name: Wait for MySQL to be healthy
        run: |
          echo "==== Waiting for MySQL to be healthy ===="
          max_attempts=30
          attempt=0
          
          until docker compose ps mysql | grep -q "healthy" || [ $attempt -eq $max_attempts ]; do
            echo "Attempt $((attempt+1))/$max_attempts: Waiting for MySQL..."
            sleep 3
            attempt=$((attempt+1))
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "ERROR: MySQL did not become healthy"
            docker compose logs mysql
            exit 1
          fi
          
          echo "✓ MySQL is healthy"
      
      - name: Wait for WordPress to be accessible
        run: |
          echo "==== Waiting for WordPress to respond ===="
          max_attempts=60
          attempt=0
          
          until curl -f -s http://localhost:8889 > /dev/null 2>&1 || [ $attempt -eq $max_attempts ]; do
            echo "Attempt $((attempt+1))/$max_attempts: Waiting for WordPress..."
            sleep 3
            attempt=$((attempt+1))
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "ERROR: WordPress is not accessible"
            echo "==== Nginx logs ===="
            docker compose logs wordpress-develop
            echo "==== PHP logs ===="
            docker compose logs php
            exit 1
          fi
          
          echo "✓ WordPress is accessible at http://localhost:8889"
      
      - name: Install WordPress
        run: |
          echo "==== Installing WordPress via WP-CLI ===="
          docker compose run --rm cli wp core install \
            --url="http://localhost:8889" \
            --title="WordPress Develop" \
            --admin_user="admin" \
            --admin_password="password" \
            --admin_email="admin@example.com" \
            --skip-email
          
          echo "==== Verifying WordPress installation ===="
          docker compose run --rm cli wp core version
          docker compose run --rm cli wp user list
      
      - name: Configure WordPress for testing
        run: |
          echo "==== Configuring WordPress ===="
          
          # Set permalink structure
          docker compose run --rm cli wp rewrite structure '/%postname%/' || true
          
          # Flush rewrite rules
          docker compose run --rm cli wp rewrite flush --hard || true
          
          # Set timezone
          docker compose run --rm cli wp option update timezone_string 'UTC' || true
          
          echo "✓ WordPress configured for testing"
      
      - name: Verify WordPress is working
        run: |
          echo "==== Testing WordPress endpoints ===="
          
          # Test home page
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8889)
          echo "Home page: HTTP $response"
          
          # Test login page
          login_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8889/wp-login.php)
          echo "Login page: HTTP $login_response"
          
          # Test admin
          admin_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8889/wp-admin/)
          echo "Admin redirect: HTTP $admin_response"
          
          if [ "$login_response" = "200" ]; then
            echo "✓ WordPress is working correctly"
          else
            echo "✗ WordPress login page returned HTTP $login_response"
            docker compose logs wordpress-develop
            docker compose logs php
            exit 1
          fi
      
      - name: Show WordPress info
        run: |
          echo "==== WordPress Information ===="
          docker compose run --rm cli wp core check-update || true
          docker compose run --rm cli wp plugin list --status=active || true
          docker compose run --rm cli wp theme list --status=active || true
      
      - name: Run Cypress tests
        run: |
          echo "==== Running Cypress tests ===="
          docker compose up cypress --abort-on-container-exit --exit-code-from cypress
        continue-on-error: true
        id: cypress-run
      
      - name: Get Cypress container logs
        if: always()
        run: |
          echo "==== Cypress logs ===="
          docker compose logs cypress 2>&1 || echo "No Cypress logs available"
      
      - name: Check Cypress exit code
        if: always()
        id: cypress-result
        run: |
          # Get the exit code from the Cypress container
          container_id=$(docker compose ps -q cypress 2>/dev/null)
          if [ -n "$container_id" ]; then
            exit_code=$(docker inspect $container_id --format='{{.State.ExitCode}}')
          else
            exit_code=1
          fi
          echo "Cypress exit code: $exit_code"
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
      
      - name: Copy test artifacts from container
        if: always()
        run: |
          echo "==== Copying test artifacts ===="
          
          # Check if artifacts exist in mounted volume
          echo "Local screenshots directory:"
          ls -la tests/cypress/screenshots/ 2>/dev/null || echo "No screenshots directory"
          
          echo "Local videos directory:"
          ls -la tests/cypress/videos/ 2>/dev/null || echo "No videos directory"
      
      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ github.run_number }}
          path: tests/cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ github.run_number }}
          path: tests/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Generate test report
        if: always()
        run: |
          echo "## Cypress Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Exit Code:** ${{ steps.cypress-result.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.cypress-result.outputs.exit_code }}" = "0" ]; then
            echo "**Status:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Screenshots: \`cypress-screenshots-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Videos: \`cypress-videos-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
      
      - name: Display service logs on failure
        if: failure()
        run: |
          echo "==== WordPress (Nginx) logs ===="
          docker compose logs --tail=200 wordpress-develop
          
          echo "==== PHP logs ===="
          docker compose logs --tail=200 php
          
          echo "==== MySQL logs ===="
          docker compose logs --tail=100 mysql
          
          echo "==== Cypress logs ===="
          docker compose logs cypress
      
      - name: Cleanup Docker environment
        if: always()
        run: |
          echo "==== Stopping and removing containers ===="
          docker compose down -v --remove-orphans
          
          echo "==== Docker cleanup complete ===="
      
      - name: Restore original docker-compose.yml
        if: always()
        run: |
          if [ -f docker-compose.yml.backup ]; then
            mv docker-compose.yml.backup docker-compose.yml
            echo "✓ Restored original docker-compose.yml"
          fi
      
      - name: Fail job if Cypress tests failed
        if: always() && steps.cypress-result.outputs.exit_code != '0'
        run: |
          echo "❌ Cypress tests failed with exit code ${{ steps.cypress-result.outputs.exit_code }}"
          exit 1
