name: API Testing

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  pytest-api-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      
      - name: Install test dependencies
        run: |
          pip install pytest requests jsonschema
      
      - name: Create Docker Compose file
        run: |
          cat > docker-compose.test.yml << 'EOF'
          services:
            mysql:
              image: mysql:8.0
              environment:
                MYSQL_ROOT_PASSWORD: password
                MYSQL_DATABASE: wordpress_test
              ports:
                - "3306:3306"
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
                interval: 5s
                timeout: 5s
                retries: 10
              networks:
                - wordpress-network
            
            wordpress:
              image: wordpress:latest
              depends_on:
                mysql:
                  condition: service_healthy
              environment:
                WORDPRESS_DB_HOST: mysql:3306
                WORDPRESS_DB_USER: root
                WORDPRESS_DB_PASSWORD: password
                WORDPRESS_DB_NAME: wordpress_test
                WORDPRESS_DEBUG: 1
              ports:
                - "8000:80"
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost"]
                interval: 5s
                timeout: 5s
                retries: 10
              networks:
                - wordpress-network
              # Enable mod_rewrite and configure .htaccess
              entrypoint: >
                bash -c "
                a2enmod rewrite &&
                chown -R www-data:www-data /var/www/html &&
                docker-entrypoint.sh apache2-foreground
                "
            
            wpcli:
              image: wordpress:cli
              depends_on:
                wordpress:
                  condition: service_healthy
              environment:
                WORDPRESS_DB_HOST: mysql:3306
                WORDPRESS_DB_USER: root
                WORDPRESS_DB_PASSWORD: password
                WORDPRESS_DB_NAME: wordpress_test
              volumes:
                - wordpress_data:/var/www/html
              networks:
                - wordpress-network
              command: tail -f /dev/null
          
          networks:
            wordpress-network:
              driver: bridge
          
          volumes:
            wordpress_data:
          EOF
          
          cat docker-compose.test.yml
      
      - name: Start Docker Compose services
        run: |
          echo "==== Starting services ===="
          docker compose -f docker-compose.test.yml up -d
          
          echo "==== Waiting for services ===="
          sleep 20
          
          echo "==== Service status ===="
          docker compose -f docker-compose.test.yml ps
      
      - name: Wait for WordPress to be ready
        run: |
          echo "==== Waiting for WordPress ===="
          max_attempts=60
          attempt=0
          
          until curl -f -s http://localhost:8000 > /dev/null 2>&1 || [ $attempt -eq $max_attempts ]; do
            echo "Attempt $((attempt+1))/$max_attempts: Waiting..."
            sleep 5
            attempt=$((attempt+1))
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "ERROR: WordPress not ready"
            docker compose -f docker-compose.test.yml logs wordpress
            exit 1
          fi
          
          echo "✓ WordPress is ready"
          
          # Give it extra time to fully initialize
          echo "Waiting additional 10 seconds for complete initialization..."
          sleep 10
      
      - name: Install WordPress
        run: |
          echo "==== Installing WordPress ===="
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp core install \
            --url="http://localhost:8000" \
            --title="Test Site" \
            --admin_user="admin" \
            --admin_password="password" \
            --admin_email="admin@example.com" \
            --skip-email \
            --allow-root
          
          echo "==== Configuring permalinks for REST API ===="
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp rewrite structure '/%postname%/' --allow-root
          
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp rewrite flush --hard --allow-root
          
          echo "==== Verifying installation ===="
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp core version --allow-root
          
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp user list --allow-root
          
          echo "==== Checking rewrite rules ===="
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp rewrite list --allow-root
      
      - name: Create sample WordPress data
        run: |
          echo "==== Creating sample posts ===="
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp post create \
            --post_title="Hello World" \
            --post_content="This is the first test post." \
            --post_status=publish \
            --allow-root
          
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp post create \
            --post_title="Second Post" \
            --post_content="This is the second test post." \
            --post_status=publish \
            --allow-root
          
          echo "==== Creating test user ===="
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp user create testuser test@example.com \
            --role=subscriber \
            --user_pass=password \
            --allow-root
          
          echo "==== Creating category ===="
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp term create category SampleCategory \
            --allow-root
          
          echo "==== Verifying created content ===="
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp post list --allow-root
          
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp user list --allow-root
          
          docker compose -f docker-compose.test.yml exec -T wpcli \
            wp term list category --allow-root
      
      - name: Verify WordPress API
        run: |
          echo "==== Testing WordPress REST API ===="
          
          # Test root endpoint with proper headers
          echo "Testing API root endpoint..."
          response=$(curl -s -H "Accept: application/json" http://localhost:8000/wp-json/)
          
          if echo "$response" | grep -q '"name"'; then
            echo "✓ API root endpoint is working"
            echo "$response" | python3 -m json.tool | head -20
          else
            echo "✗ API root endpoint returned HTML instead of JSON"
            echo "Response preview:"
            echo "$response" | head -50
            echo ""
            echo "Checking if mod_rewrite is working..."
            curl -I http://localhost:8000/wp-json/
            exit 1
          fi
          
          # Test posts endpoint
          echo ""
          echo "Testing posts endpoint..."
          posts_response=$(curl -s -H "Accept: application/json" http://localhost:8000/wp-json/wp/v2/posts)
          
          if echo "$posts_response" | grep -q '\['; then
            echo "✓ Posts endpoint is working"
            echo "$posts_response" | python3 -m json.tool | head -20
          else
            echo "✗ Posts endpoint failed"
            echo "$posts_response" | head -30
          fi
          
          # Test users endpoint
          echo ""
          echo "Testing users endpoint..."
          users_response=$(curl -s -H "Accept: application/json" http://localhost:8000/wp-json/wp/v2/users)
          
          if echo "$users_response" | grep -q '\['; then
            echo "✓ Users endpoint is working"
          else
            echo "⚠ Users endpoint may have issues"
          fi
      
      - name: Run API Tests
        run: |
          echo "==== Running pytest API tests ===="
          pytest tests/api_test/ -v --tb=short
        env:
          API_BASE_URL: http://localhost:8000/wp-json/
      
      - name: Show logs on failure
        if: failure()
        run: |
          echo "==== WordPress logs ===="
          docker compose -f docker-compose.test.yml logs wordpress
          
          echo "==== MySQL logs ===="
          docker compose -f docker-compose.test.yml logs mysql
          
          echo "==== WP-CLI logs ===="
          docker compose -f docker-compose.test.yml logs wpcli
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_number }}
          path: |
            tests/api_test/
            .pytest_cache/
          if-no-files-found: ignore
      
      - name: Cleanup
        if: always()
        run: |
          echo "==== Cleaning up ===="
          docker compose -f docker-compose.test.yml down -v
