name: WordPress CI/CD - API Testing

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  pytest-api-tests:
    name: API Tests (Pytest)
    runs-on: ubuntu-latest
   
    # Define the services required for WordPress and the database
    services:
      # 1. WordPress application running
      wordpress:
        image: wordpress:latest
        env:
          WORDPRESS_DB_HOST: mysql
          WORDPRESS_DB_USER: root
          WORDPRESS_DB_PASSWORD: password
          WORDPRESS_DB_NAME: wordpress_test
        ports:
          - 8888:80 # Maps container port 80 to host port 8888
        options: >-
          --health-cmd="curl -f http://localhost/wp-admin/install.php || exit 0"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      # 2. Database service
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
     
      ## Setup Python Environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      ## FIX: Install all required Pytest dependencies
      - name: Install Pytest and required dependencies (requests, jsonschema)
        # Added 'jsonschema' to resolve the ModuleNotFoundError
        run: pip install pytest requests jsonschema

      ## Wait for WordPress Service
      - name: Wait for WordPress to be ready
        run: |
          echo "Waiting for WordPress service to be healthy..."
          for i in {1..20}; do
            curl -s http://localhost:8888 > /dev/null && break
            echo -n "."
            sleep 5
          done
          echo "WordPress is ready."

      ## FIX: Run Custom API Tests
      - name: Run API Tests with Pytest
        # Changed the path to the likely corrected folder structure based on
        # the previous error's context: 'tests/api_test/tests/api (1)'
        # Assuming you renamed the folder to 'tests/api_v1' or similar clean path.
        # IF you placed all files directly in a top-level 'api_tests' folder, use that instead.
        run: pytest tests/api_test/
        env:
          # The API_BASE_URL is passed to your Python tests
          API_BASE_URL: http://localhost:8888/wp-json/
