name: API Testing

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  pytest-api-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install npm dependencies
        run: |
          echo "==== Installing npm dependencies ===="
          npm ci
      
      - name: Build WordPress
        run: |
          echo "==== Building WordPress ===="
          npm run build:dev
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      
      - name: Install test dependencies
        run: |
          pip install pytest requests jsonschema
      
      - name: Set up environment variables
        run: |
          cat > .env << 'EOF'
          LOCAL_PHP=8.2-fpm
          LOCAL_PORT=8889
          LOCAL_DIR=src
          LOCAL_DB_TYPE=mysql
          LOCAL_DB_VERSION=8.0
          LOCAL_PHP_XDEBUG=false
          LOCAL_PHP_MEMCACHED=false
          PHP_FPM_UID=1000
          PHP_FPM_GID=1000
          EOF
          
          cat .env
      
      - name: Start Docker Compose services
        run: |
          echo "==== Starting Docker Compose services ===="
          docker compose up -d wordpress-develop php mysql cli
          
          echo "==== Waiting for services to initialize ===="
          sleep 20
          
          echo "==== Service status ===="
          docker compose ps
      
      - name: Wait for MySQL to be healthy
        run: |
          echo "==== Waiting for MySQL ===="
          max_attempts=30
          attempt=0
          
          until docker compose ps mysql | grep -q "healthy" || [ $attempt -eq $max_attempts ]; do
            echo "Attempt $((attempt+1))/$max_attempts: Waiting for MySQL..."
            sleep 3
            attempt=$((attempt+1))
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "ERROR: MySQL not healthy"
            docker compose logs mysql
            exit 1
          fi
          
          echo "✓ MySQL is healthy"
      
      - name: Wait for WordPress to be accessible
        run: |
          echo "==== Waiting for WordPress ===="
          max_attempts=60
          attempt=0
          
          until curl -f -s http://localhost:8889 > /dev/null 2>&1 || [ $attempt -eq $max_attempts ]; do
            echo "Attempt $((attempt+1))/$max_attempts: Waiting..."
            sleep 5
            attempt=$((attempt+1))
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "ERROR: WordPress not accessible"
            docker compose logs wordpress-develop
            docker compose logs php
            exit 1
          fi
          
          echo "✓ WordPress is accessible at http://localhost:8889"
      
      - name: Install WordPress
        run: |
          echo "==== Installing WordPress ===="
          docker compose run --rm cli \
            wp core install \
            --url="http://localhost:8889" \
            --title="Test Site" \
            --admin_user="admin" \
            --admin_password="password" \
            --admin_email="admin@example.com" \
            --skip-email \
            --path="/var/www/src"
          
          echo "==== Configuring permalinks ===="
          docker compose run --rm cli \
            wp rewrite structure '/%postname%/' \
            --path="/var/www/src"
          
          docker compose run --rm cli \
            wp rewrite flush --hard \
            --path="/var/www/src"
          
          echo "==== Verifying installation ===="
          docker compose run --rm cli \
            wp core version \
            --path="/var/www/src"
          
          docker compose run --rm cli \
            wp user list \
            --path="/var/www/src"
      
      - name: Create sample WordPress data
        run: |
          echo "==== Creating sample posts ===="
          docker compose run --rm cli \
            wp post create \
            --post_title="Hello World" \
            --post_content="This is the first test post." \
            --post_status=publish \
            --path="/var/www/src"
          
          docker compose run --rm cli \
            wp post create \
            --post_title="Second Post" \
            --post_content="This is the second test post." \
            --post_status=publish \
            --path="/var/www/src"
          
          echo "==== Creating test user ===="
          docker compose run --rm cli \
            wp user create testuser test@example.com \
            --role=subscriber \
            --user_pass=password \
            --path="/var/www/src"
          
          echo "==== Creating category ===="
          docker compose run --rm cli \
            wp term create category SampleCategory \
            --path="/var/www/src"
          
          echo "==== Verifying created content ===="
          docker compose run --rm cli \
            wp post list \
            --path="/var/www/src"
          
          docker compose run --rm cli \
            wp user list \
            --path="/var/www/src"
      
      - name: Verify WordPress API
        run: |
          echo "==== Testing WordPress REST API ===="
          
          # Test root endpoint
          echo "Testing API root endpoint..."
          response=$(curl -s -H "Accept: application/json" http://localhost:8889/wp-json/)
          
          if echo "$response" | grep -q '"name"'; then
            echo "✓ API root endpoint is working"
            echo "$response" | python3 -m json.tool | head -20
          else
            echo "✗ API root endpoint returned unexpected response"
            echo "Response preview:"
            echo "$response" | head -50
            
            # Check if it's a rewrite issue
            echo ""
            echo "Testing direct index.php access..."
            curl -s -I http://localhost:8889/index.php?rest_route=/
            
            exit 1
          fi
          
          # Test posts endpoint
          echo ""
          echo "Testing posts endpoint..."
          posts_response=$(curl -s -H "Accept: application/json" http://localhost:8889/wp-json/wp/v2/posts)
          
          if echo "$posts_response" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
            echo "✓ Posts endpoint is working"
            echo "$posts_response" | python3 -m json.tool | head -30
          else
            echo "✗ Posts endpoint failed"
            echo "$posts_response" | head -30
          fi
      
      - name: Check test configuration
        run: |
          echo "==== Checking test configuration files ===="
          
          # Find conftest.py or config files
          find tests/api_test -name "conftest.py" -o -name "config.py" -o -name "__init__.py" | while read file; do
            echo "Found: $file"
            cat "$file"
          done
          
          # Check if there's a pytest.ini or setup.cfg
          if [ -f tests/api_test/pytest.ini ]; then
            echo "Found pytest.ini:"
            cat tests/api_test/pytest.ini
          fi
          
          if [ -f tests/api_test/setup.cfg ]; then
            echo "Found setup.cfg:"
            cat tests/api_test/setup.cfg
          fi
      
      - name: Update test configuration for correct port
        run: |
          echo "==== Updating test configuration ===="
          
          # Find and update any hardcoded localhost:8000 references
          find tests/api_test -type f -name "*.py" -exec grep -l "localhost:8000" {} \; | while read file; do
            echo "Updating $file"
            sed -i 's|localhost:8000|localhost:8889|g' "$file"
            sed -i 's|http://localhost/wp-json|http://localhost:8889/wp-json|g' "$file"
          done
          
          # Update conftest.py if it exists
          if [ -f tests/api_test/conftest.py ]; then
            echo "Updating conftest.py"
            sed -i 's|localhost:8000|localhost:8889|g' tests/api_test/conftest.py
          fi
          
          # Create or update a config file to use environment variable
          cat > tests/api_test/test_config.py << 'EOF'
          import os
          
          # Get base URL from environment variable or use default
          API_BASE_URL = os.environ.get('API_BASE_URL', 'http://localhost:8889/wp-json/')
          WP_BASE_URL = os.environ.get('WP_BASE_URL', 'http://localhost:8889')
          
          # Authentication
          USERNAME = os.environ.get('WP_USERNAME', 'admin')
          PASSWORD = os.environ.get('WP_PASSWORD', 'password')
          
          print(f"Using API_BASE_URL: {API_BASE_URL}")
          print(f"Using WP_BASE_URL: {WP_BASE_URL}")
          EOF
          
          echo "✓ Test configuration updated"
      
      - name: Run API Tests
        run: |
          echo "==== Running pytest API tests ===="
          pytest tests/api_test/ -v --tb=short -x
        env:
          API_BASE_URL: http://localhost:8889/wp-json/
          WP_BASE_URL: http://localhost:8889
          WP_USERNAME: admin
          WP_PASSWORD: password
      
      - name: Show logs on failure
        if: failure()
        run: |
          echo "==== WordPress (Nginx) logs ===="
          docker compose logs wordpress-develop
          
          echo "==== PHP logs ===="
          docker compose logs php
          
          echo "==== MySQL logs ===="
          docker compose logs mysql
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_number }}
          path: |
            tests/api_test/
            .pytest_cache/
          if-no-files-found: ignore
      
      - name: Cleanup
        if: always()
        run: |
          echo "==== Cleaning up ===="
          docker compose down -v
