name: API-test

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  pytest-api-tests:
    # Removed 'needs: phpunit-tests' as the unit tests job is gone
    name: API Tests (Pytest)
    runs-on: ubuntu-latest
    
    # Define the services needed for the API tests
    services:
      # 1. WordPress application running (simulated by a standard PHP server)
      #    This is your application under test.
      wordpress:
        image: wordpress:latest
        env:
          WORDPRESS_DB_HOST: mysql
          WORDPRESS_DB_USER: root
          WORDPRESS_DB_PASSWORD: password
          WORDPRESS_DB_NAME: wordpress_test
        ports:
          - 8888:80 # Map port 8888 on the host to port 80 in the container
        options: >-
          --health-cmd="curl -f http://localhost/wp-admin/install.php || exit 0"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      # 2. Database service required by the WordPress service
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
      
      ## Setup Python Environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      ## Install Pytest and Requests
      - name: Install Pytest and dependencies
        run: pip install pytest requests

      ## Wait for WordPress Service
      # This step ensures the WordPress container is up and running before tests begin.
      - name: Wait for WordPress to be ready
        run: |
          echo "Waiting for WordPress service to be healthy..."
          for i in {1..20}; do
            # Check the mapped port on localhost (the runner)
            curl -s http://localhost:8888 > /dev/null && break
            echo -n "."
            sleep 5
          done
          echo "WordPress is ready."

      ## Run Custom API Tests
      - name: Run API Tests with Pytest
        run: pytest tests/api_test
        env:
          # Pass the API base URL as an environment variable to your tests
          API_BASE_URL: http://localhost:8888/wp-json/

