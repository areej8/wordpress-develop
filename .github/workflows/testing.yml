name: API Testing

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  pytest-api-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      wordpress:
        image: wordpress:latest
        env:
          WORDPRESS_DB_HOST: mysql
          WORDPRESS_DB_USER: root
          WORDPRESS_DB_PASSWORD: password
          WORDPRESS_DB_NAME: wordpress_test
        ports:
          - 8000:80
        options: >-
          --health-cmd="curl -f http://localhost/wp-admin/install.php || exit 0"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      # Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Install pytest + dependencies
      - name: Install test dependencies
        run: pip install pytest requests jsonschema

      # Wait for WordPress to respond
      - name: Wait for WordPress
        run: |
          echo "Waiting for WordPress to be ready..."
          for i in {1..60}; do
            curl -s http://localhost:8000 > /dev/null && break
            echo -n "."
            sleep 5
          done
          echo "WordPress is ready."

      # Install WP-CLI (official method)
      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      # Perform WordPress installation
      - name: Install WordPress using WP-CLI
        run: |
          wp core install \
            --url="http://localhost:8000" \
            --title="Test Site" \
            --admin_user="admin" \
            --admin_password="password" \
            --admin_email="admin@example.com" \
            --skip-email \
            --allow-root

      # Add sample data needed for API tests
      - name: Create sample WP data
        run: |
          wp post create --post_title="Hello World" --post_status=publish --allow-root
          wp post create --post_title="Second Post" --post_status=publish --allow-root

          wp user create testuser test@example.com \
            --role=subscriber --user_pass=password --allow-root

          wp term create category SampleCategory --allow-root

      # Run pytest tests
      - name: Run API Tests
        run: pytest tests/api_test/
        env:
          API_BASE_URL: http://localhost:8000/wp-json/

