name: API Testing

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  pytest-api-tests:
    name: API Tests (Pytest)
    runs-on: ubuntu-latest
   
    # Define the services required for WordPress and the database
    services:
      # 1. WordPress application running
      wordpress:
        image: wordpress:latest
        env:
          WORDPRESS_DB_HOST: mysql
          WORDPRESS_DB_USER: root
          WORDPRESS_DB_PASSWORD: password
          WORDPRESS_DB_NAME: wordpress_test
        ports:
          # FIX 1: Changed port mapping from 8888 to 8000 to match the test's connection attempt.
          - 8000:80 # Maps container port 80 to host port 8000

        options: >-
          --health-cmd="curl -f http://localhost/wp-admin/install.php || exit 0"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      # 2. Database service
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
     
      ## Setup Python Environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      ## FIX 2: Install all required Pytest dependencies
      - name: Install Pytest and required dependencies (requests, jsonschema)
        # Added 'jsonschema' to resolve the ModuleNotFoundError from earlier logs
        run: pip install pytest requests jsonschema

      ## Wait for WordPress Service
      - name: Wait for WordPress to be ready
        run: |
          echo "Waiting for WordPress service to be healthy..."
          # Increased loop count to 30 for stability (up to 2.5 minutes wait time)
          for i in {1..30}; do
            # Check the mapped port on localhost (the runner)
            curl -s http://localhost:8000 > /dev/null && break
            echo -n "."
            sleep 5
          done
          echo "WordPress is ready."

      ## FIX 3: Run Custom API Tests
      - name: Run API Tests with Pytest
        # Uses the likely fixed, cleaner path after renaming files and folders
        run: pytest tests/api_test/
        env:
          # FIX 4: Set API_BASE_URL to 8000 to match the new service port mapping.
          API_BASE_URL: http://localhost:8000/wp-json/
