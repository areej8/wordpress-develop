name: WordPress CI/CD Pipeline
on:
  push:
    branches: [trunk, main]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '18'

jobs:
  # ========== STAGE 1: SOURCE VALIDATION ==========
  source:
    name: "🔍 1. Source Stage"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Repository information
      run: |
        echo "=== WORDPRESS CI/CD PIPELINE ==="
        echo "Repository: $(git config --get remote.origin.url)"
        echo "Branch: ${GITHUB_REF#refs/heads/}"
        echo "Commit: $(git rev-parse --short HEAD)"
        echo "Event: ${{ github.event_name }}"
        echo ""
        echo "📁 WordPress Structure:"
        echo "Root wp-config-sample.php: $( [ -f "wp-config-sample.php" ] && echo '✅ YES' || echo '❌ NO' )"
        echo "src/index.php: $( [ -f "src/index.php" ] && echo '✅ YES' || echo '❌ NO' )"
        echo "src/wp-admin: $( [ -d "src/wp-admin" ] && echo '✅ YES' || echo '❌ NO' )"
        echo "src/wp-includes: $( [ -d "src/wp-includes" ] && echo '✅ YES' || echo '❌ NO' )"
        echo "src/wp-content: $( [ -d "src/wp-content" ] && echo '✅ YES' || echo '❌ NO' )"
    
    - name: Validate essential files
      run: |
        echo "🔍 Validating essential WordPress files..."
        
        # WordPress development repo has wp-config-sample.php at ROOT, not in src/
        ESSENTIAL_FILES=(
          "wp-config-sample.php"     # At ROOT level
          "src/index.php"
          "src/wp-load.php"
          "src/wp-settings.php"
          "src/license.txt"
          "src/readme.html"
          "src/wp-admin/index.php"
          "src/wp-includes/version.php"
        )
        
        ALL_OK=true
        for file in "${ESSENTIAL_FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file"
          else
            echo "❌ MISSING: $file"
            ALL_OK=false
          fi
        done
        
        if [ "$ALL_OK" = false ]; then
          echo "❌ Missing essential WordPress files!"
          exit 1
        else
          echo "✅ All essential files found!"
        fi
    
    - name: Quick PHP syntax check
      run: |
        echo "🔧 Quick PHP syntax check..."
        # Check a few key files
        KEY_FILES=(
          "src/index.php"
          "wp-config-sample.php"  # Root level
          "src/wp-load.php"
          "src/wp-settings.php"
        )
        
        for file in "${KEY_FILES[@]}"; do
          if php -l "$file" >/dev/null 2>&1; then
            echo "✅ $file - Syntax OK"
          else
            echo "❌ $file - Syntax error"
            php -l "$file" 2>&1 | head -3
            exit 1
          fi
        done

  # ========== STAGE 2: BUILD ==========
  build:
    name: "🏗️ 2. Build Stage"
    needs: source
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mysqli, gd, mbstring
    
    - name: Create WordPress build package
      run: |
        echo "📦 Creating WordPress build package..."
        
        # Create timestamp for build
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BUILD_NAME="wordpress-build-$TIMESTAMP"
        
        # Create build directory
        mkdir -p "$BUILD_NAME"
        
        echo "Copying WordPress files..."
        # Copy src/ content (WordPress core)
        cp -r src/* "$BUILD_NAME"/
        # Copy config sample from root
        cp wp-config-sample.php "$BUILD_NAME"/
        
        # Create build info file
        echo "WordPress Build Information" > "$BUILD_NAME/BUILD-INFO.txt"
        echo "===========================" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "Build Date: $(date)" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "Source: WordPress Development Repository" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "Branch: $(git branch --show-current)" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "Commit: $(git rev-parse --short HEAD)" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "PHP Version: $(php --version | head -1)" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "Total Files: $(find "$BUILD_NAME" -type f | wc -l)" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "Total Size: $(du -sh "$BUILD_NAME" | cut -f1)" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "===========================" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "Essential Files Check:" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "- index.php: $([ -f "$BUILD_NAME/index.php" ] && echo '✅ Present' || echo '❌ Missing')" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "- wp-admin/: $([ -d "$BUILD_NAME/wp-admin" ] && echo '✅ Present' || echo '❌ Missing')" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "- wp-includes/: $([ -d "$BUILD_NAME/wp-includes" ] && echo '✅ Present' || echo '❌ Missing')" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "- wp-content/: $([ -d "$BUILD_NAME/wp-content" ] && echo '✅ Present' || echo '❌ Missing')" >> "$BUILD_NAME/BUILD-INFO.txt"
        echo "- wp-config-sample.php: $([ -f "$BUILD_NAME/wp-config-sample.php" ] && echo '✅ Present' || echo '❌ Missing')" >> "$BUILD_NAME/BUILD-INFO.txt"
        
        # Show build contents
        echo ""
        echo "📁 Build contents ($BUILD_NAME):"
        ls -la "$BUILD_NAME/" | head -20
        echo ""
        echo "📊 Build statistics:"
        echo "Total files: $(find "$BUILD_NAME" -type f | wc -l)"
        echo "Total directories: $(find "$BUILD_NAME" -type d | wc -l)"
        echo "Total size: $(du -sh "$BUILD_NAME" | cut -f1)"
        
        # Create ZIP archive
        echo ""
        echo "📦 Creating ZIP archive..."
        zip -r "wordpress-$TIMESTAMP.zip" "$BUILD_NAME"
        echo "✅ Created: wordpress-$TIMESTAMP.zip"
        ls -lh "wordpress-$TIMESTAMP.zip"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wordpress-build
        path: |
          wordpress-*.zip
          wordpress-build-*/
        retention-days: 7

  # ========== STAGE 3: TEST ==========
  test:
    name: "🧪 3. Test Stage"
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: wordpress-build
        path: downloaded-build
    
    - name: Test WordPress build
      run: |
        echo "🧪 TESTING WORDPRESS BUILD"
        echo "============================"
        
        # Find the build directory
        BUILD_DIR=$(find downloaded-build -type d -name "wordpress-build-*" | head -1)
        
        if [ -z "$BUILD_DIR" ]; then
          echo "❌ ERROR: No build directory found!"
          ls -la downloaded-build/
          exit 1
        fi
        
        echo "Testing build in: $BUILD_DIR"
        echo ""
        
        # Test 1: Check essential files exist
        echo "📋 TEST 1: Essential Files Check"
        echo "--------------------------------"
        
        ESSENTIAL_FILES_TEST=(
          "$BUILD_DIR/index.php"
          "$BUILD_DIR/wp-config-sample.php"
          "$BUILD_DIR/wp-load.php"
          "$BUILD_DIR/wp-settings.php"
          "$BUILD_DIR/wp-admin/index.php"
          "$BUILD_DIR/wp-includes/version.php"
          "$BUILD_DIR/license.txt"
          "$BUILD_DIR/readme.html"
        )
        
        ALL_TESTS_PASS=true
        for file in "${ESSENTIAL_FILES_TEST[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file"
          else
            echo "❌ MISSING: $file"
            ALL_TESTS_PASS=false
          fi
        done
        
        echo ""
        
        # Test 2: Check directory structure
        echo "📁 TEST 2: Directory Structure"
        echo "-----------------------------"
        
        ESSENTIAL_DIRS=(
          "$BUILD_DIR/wp-admin"
          "$BUILD_DIR/wp-includes"
          "$BUILD_DIR/wp-content"
        )
        
        for dir in "${ESSENTIAL_DIRS[@]}"; do
          if [ -d "$dir" ]; then
            echo "✅ $dir/ (Files: $(find "$dir" -type f | wc -l))"
          else
            echo "❌ MISSING: $dir/"
            ALL_TESTS_PASS=false
          fi
        done
        
        echo ""
        
        # Test 3: File counts
        echo "📊 TEST 3: Build Statistics"
        echo "--------------------------"
        echo "Total PHP files: $(find "$BUILD_DIR" -name "*.php" -type f | wc -l)"
        echo "Total JS files: $(find "$BUILD_DIR" -name "*.js" -type f | wc -l)"
        echo "Total CSS files: $(find "$BUILD_DIR" -name "*.css" -type f | wc -l)"
        echo "Build size: $(du -sh "$BUILD_DIR" | cut -f1)"
        
        echo ""
        
        # Test 4: Quick PHP syntax check on key files
        echo "🔧 TEST 4: Quick PHP Syntax Check"
        echo "--------------------------------"
        
        # Check a few key PHP files
        for phpfile in "$BUILD_DIR/index.php" "$BUILD_DIR/wp-config-sample.php"; do
          if php -l "$phpfile" >/dev/null 2>&1; then
            echo "✅ $(basename "$phpfile") - Syntax OK"
          else
            echo "❌ $(basename "$phpfile") - Syntax error"
            php -l "$phpfile" 2>&1 | head -3
            ALL_TESTS_PASS=false
          fi
        done
        
        echo ""
        echo "============================"
        
        if [ "$ALL_TESTS_PASS" = true ]; then
          echo "🎉 ALL TESTS PASSED!"
          echo "✅ WordPress build is valid and ready for deployment"
        else
          echo "❌ SOME TESTS FAILED"
          echo "WordPress build has issues that need to be fixed"
          exit 1
        fi
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: downloaded-build/
        retention-days: 1

  # ========== STAGE 4: STAGING ==========
  staging:
    name: "🚀 4. Staging Stage"
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/trunk'
    
    environment:
      name: staging
      url: https://staging.example.com
    
    steps:
    - name: Download tested build
      uses: actions/download-artifact@v4
      with:
        name: wordpress-build
        path: .
    
    - name: Simulate staging deployment
      run: |
        echo "🚀 STAGING DEPLOYMENT SIMULATION"
        echo "================================"
        echo "Deploying WordPress to staging environment..."
        echo ""
        
        # Find the latest build
        BUILD_ZIP=$(ls -t wordpress-*.zip | head -1)
        
        if [ -z "$BUILD_ZIP" ]; then
          echo "❌ No build ZIP found!"
          exit 1
        fi
        
        echo "📦 Build to deploy: $BUILD_ZIP"
        echo "📏 Size: $(du -h "$BUILD_ZIP" | cut -f1)"
        echo ""
        
        echo "🔧 Deployment steps:"
        echo "1. Backup current staging site ✓"
        echo "2. Upload $BUILD_ZIP to server ✓"
        echo "3. Extract to /var/www/staging/ ✓"
        echo "4. Update database configuration ✓"
        echo "5. Set file permissions ✓"
        echo "6. Clear cache ✓"
        echo "7. Restart web server ✓"
        echo ""
        
        echo "🏥 Health checks:"
        echo "• WordPress is accessible ✓"
        echo "• Database connection working ✓"
        echo "• All plugins compatible ✓"
        echo "• Theme functioning correctly ✓"
        echo ""
        
        echo "✅ Staging deployment complete!"
        echo "🌐 Staging URL: https://staging.example.com"
        echo "👀 Review at: https://staging.example.com/wp-admin"

  # ========== STAGE 5: PRODUCTION ==========
  production:
    name: "🌐 5. Production Stage"
    needs: staging
    runs-on: ubuntu-latest
    if: success()
    
    environment:
      name: production
      url: https://example.com
    
    steps:
    - name: Production deployment confirmation
      run: |
        echo "🚨 PRODUCTION DEPLOYMENT CONFIRMATION"
        echo "====================================="
        echo "THIS WILL DEPLOY TO PRODUCTION!"
        echo ""
        echo "📋 Deployment Details:"
        echo "• Application: WordPress"
        echo "• Version: $(git describe --tags --always)"
        echo "• Branch: ${GITHUB_REF#refs/heads/}"
        echo "• Commit: $(git rev-parse --short HEAD)"
        echo "• Time: $(date)"
        echo ""
        echo "✅ Staging verification: PASSED"
        echo "✅ All tests: PASSED"
        echo "✅ Build validation: COMPLETE"
        echo ""
        echo "Proceed with production deployment..."
    
    - name: Simulate production deployment
      run: |
        echo "🚀 PRODUCTION DEPLOYMENT IN PROGRESS"
        echo "==================================="
        
        echo "1. 🔒 Enable maintenance mode..."
        echo "2. 💾 Create full backup of production..."
        echo "3. 📦 Deploy new WordPress version..."
        echo "4. 🗃️ Run database migrations..."
        echo "5. 🔄 Switch to new version..."
        echo "6. 🧪 Verify deployment..."
        echo "7. 🔓 Disable maintenance mode..."
        echo "8. 📊 Enable monitoring..."
        
        sleep 3
        
        echo ""
        echo "✅ PRODUCTION DEPLOYMENT COMPLETE!"
        echo "🌐 Production URL: https://example.com"
        echo "⏱️ Deployment time: $(date)"
        echo ""
        echo "📈 Monitoring activated:"
        echo "• Error tracking: ✅"
        echo "• Performance monitoring: ✅"
        echo "• Uptime checks: ✅"
        echo "• Security scanning: ✅"
    
    - name: Deployment verification
      run: |
        echo "🔍 FINAL VERIFICATION"
        echo "===================="
        echo "✅ All services running"
        echo "✅ Website responding"
        echo "✅ SSL certificate valid"
        echo "✅ Database connected"
        echo "✅ Cache cleared"
        echo "✅ Security headers set"
        echo ""
        echo "🎉 WORDPRESS IS NOW LIVE IN PRODUCTION!"
